# Render Blueprint — SME Advisor API + Flutter web (uses EXISTING Postgres)
# Free tier: only ONE PostgreSQL database per account — do not create a second DB here.
#
# Before sync: In Render Dashboard → your existing Postgres → copy Internal Database URL
# After deploy: sme-advisor-api → Environment → set DATABASE_URL (sync: false prompts you)

services:
  - type: web
    name: sme-advisor-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ML_MODELS_DIR
        value: /app/backend/app/ml_models
      - key: USE_VECTOR_RAG
        value: "false"
      - key: AUTH_REQUIRED
        value: "false"
      - key: DB_WAIT_ATTEMPTS
        value: "90"
      - key: DB_WAIT_INTERVAL
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: sme-advisor-web
    runtime: static
    buildCommand: chmod +x ./scripts/render_build_web.sh && ./scripts/render_build_web.sh
    staticPublishPath: ./mobile_app/build/web
    envVars:
      # Set in Render dashboard to your real API URL, e.g. https://sme-advisor-api-38lz.onrender.com
      - key: API_BASE
        sync: false
